# Runs inside nginxinc/nginx-unprivileged: non-root, listens on 8080.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. Do not add add_header inside the location blocks below:
    # nginx would then drop these inherited ones.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Tailwind and the colour swatches use inline style attributes, so style-src needs 'unsafe-inline'.
    # Razorpay's checkout script and frames will be allowed in Milestone 5, after checking their docs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Kubernetes liveness and readiness probes call this.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build files never change, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html must never be cached, so a new release is picked up immediately.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: /login, /orders/DF-123 and so on are handled by React Router in the browser.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
